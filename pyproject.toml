[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-educational"
version = "0.1.0"
description = "A small, inspectable decoder-only Transformer language model"
requires-python = ">=3.10"
dependencies = ["torch>=2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
